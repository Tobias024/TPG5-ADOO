server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subastar}
    username: ${SPRING_DATASOURCE_USERNAME:subastar}
    password: ${SPRING_DATASOURCE_PASSWORD:subastar123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:SubastARSecretKeyForJWT2026SuperSecureTokenGeneration}
  expiration: 86400000

logging:
  level:
    com.subastar: INFO
    org.springframework.security: WARN
