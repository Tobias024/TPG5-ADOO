version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subastar
      POSTGRES_USER: subastar
      POSTGRES_PASSWORD: subastar123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subastar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subastar
      SPRING_DATASOURCE_USERNAME: subastar
      SPRING_DATASOURCE_PASSWORD: subastar123
      JWT_SECRET: SubastARSecretKeyForJWT2026SuperSecureTokenGeneration
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
